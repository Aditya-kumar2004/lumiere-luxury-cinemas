<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="#0A0C10" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="32" cy="32" r="24" fill="url(#centerGlow)" />

  <!-- Outer Faceted Diamond / Aperture Geometry -->
  <path d="M32 10 L52 32 L32 54 L12 32 Z" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round" fill="none" />
  <path d="M32 16 L46 32 L32 48 L18 32 Z" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.5" stroke-linejoin="round" fill="none" />

  <!-- Cinematic Projector / Anamorphic Beam Diamond Motif -->
  <path d="M32 10 L32 54" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <path d="M12 32 L52 32" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2" />

  <!-- Stylized Elegant "L" Monogram -->
  <path d="M26 21 V41 H38" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Radiant Cinematic Star Accent -->
  <path d="M42 22 L43 25 L46 26 L43 27 L42 30 L41 27 L38 26 L41 25 Z" fill="#FDE047" />
